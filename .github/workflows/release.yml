name: Release & Multi-Channel Distribution

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (e.g. 1.0.1)'
        required: false
        default: '1.0.0'

jobs:
  build-and-publish:
    name: Build, Test & Distribute (NPM, Homebrew, GitHub)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build All Packages
        run: pnpm build

      - name: Quality Gates (Typecheck & Lint)
        run: |
          pnpm -r typecheck
          pnpm lint

      - name: Run Test Suite
        run: pnpm test

      - name: Package CLI Tarball
        id: pack
        run: |
          cd apps/cli
          TARBALL=$(npm pack)
          SHA256=$(sha256sum "$TARBALL" | awk '{print $1}')
          echo "tarball=$TARBALL" >> $GITHUB_OUTPUT
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "Packaged $TARBALL with SHA256: $SHA256"

      - name: Publish to NPM Registry
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          pnpm --filter @webicro/cli publish --access public --no-git-checks

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: apps/cli/${{ steps.pack.outputs.tarball }}
          generate_release_notes: true
          draft: false
          prerelease: false
